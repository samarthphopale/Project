server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: v1

  # FIX: Adjusted to exactly 2 spaces per nested property
  ai:
    service:
      url: ${AI_SERVICE_URL:http://python-ai-service:8000}
      chatEndpoint: ${AI_SERVICE_CHAT_ENDPOINT:/eximAI/chat}
    
    ollama:
      base-url: http://ollama:11434
      embedding:
        options:
          model: nomic-embed-text # Lightweight, highly performant embedding model
    vectorstore:
      chroma:
        initialize-schema: true
        client:
          host: http://chromadb
          port: 8000
  
  datasource:
    url: jdbc:postgresql://postgres:5432/exim
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
